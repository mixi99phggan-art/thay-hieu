<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thầy Hiếu Dạy Tiếng Hàn Quốc</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0d6efd,#3aa7ff,#00c6ff);
padding:20px;
}

.card{
width:380px;
max-width:100%;
background:#fff;
border-radius:28px;
padding:35px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.25);
animation:fade .8s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:none;
}
}

.logo{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:6px solid #0d6efd;
box-shadow:0 10px 25px rgba(0,0,0,.2);
margin-bottom:20px;
}

h1{
font-size:34px;
color:#0d6efd;
font-weight:700;
}

.sub{
margin-top:8px;
color:#666;
font-size:18px;
margin-bottom:25px;
}

.phone{
font-size:28px;
font-weight:bold;
color:#ff2b2b;
margin-bottom:25px;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
padding:16px;
margin:14px 0;
border-radius:15px;
font-size:19px;
font-weight:600;
color:#fff;
transition:.25s;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.fb{
background:#1877F2;
}

.tt{
background:#000;
}

.zl{
background:#0084ff;
}

.footer{
margin-top:25px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<div class="card">

<img src="avatar.jpg" class="logo">

<h1>Thầy Hiếu</h1>

<div class="sub">
Dạy Tiếng Hàn Quốc
</div>

<div class="phone">
📞 0915 673 448
</div>

<a class="btn zl"
href="https://zalo.me/"
target="_blank">
💬 Liên hệ Zalo
</a>

<a class="btn fb"
href="https://www.facebook.com/share/1K43uXBmv3/?mibextid=wwXIfr"
target="_blank">
📘 Facebook
</a>

<a class="btn tt"
href="https://www.tiktok.com/@thay_hieu_korea?_r=1&_t=ZS-98UeCZ7023r"
target="_blank">
🎵 TikTok
</a>

<div class="footer">
Cảm ơn bạn đã ghé thăm ❤️
</div>

</div>

</body>
</html>
