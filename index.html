<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thầy Hiếu Dạy Tiếng Hàn Quốc</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Century Gothic",CenturyGothic,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0d6efd,#42a5f5,#00c6ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:390px;
max-width:100%;
background:#fff;
border-radius:30px;
padding:35px;
text-align:center;
box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.logo{
width:160px;
height:160px;
margin:auto;
margin-bottom:25px;
border-radius:50%;
overflow:hidden;
border:6px solid #0d6efd;
box-shadow:0 10px 30px rgba(0,0,0,.25);
background:white;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
color:#0d6efd;
font-size:34px;
font-weight:bold;
margin-bottom:8px;
}

.sub{
font-size:19px;
color:#666;
margin-bottom:22px;
}

.phone{
background:#0084ff;
color:white;
padding:18px;
border-radius:15px;
font-size:18px;
line-height:1.7;
margin-bottom:25px;
box-shadow:0 8px 20px rgba(0,132,255,.3);
}

.phone strong{
display:block;
font-size:30px;
margin-top:5px;
}

.btn{
display:block;
text-decoration:none;
padding:16px;
margin:15px 0;
border-radius:15px;
font-size:20px;
font-weight:bold;
color:white;
transition:.25s;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.fb{
background:#1877F2;
}

.tt{
background:#000;
}

.footer{
margin-top:25px;
font-size:15px;
color:#777;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
<img src="https://upload.wikimedia.org/wikipedia/commons/0/09/Flag_of_South_Korea.svg">
</div>

<h1>THẦY HIẾU</h1>

<div class="sub">
DẠY TIẾNG HÀN QUỐC
</div>

<div class="phone">
📞 Điện thoại & Zalo
<strong>0915 673 448</strong>
</div>

<a class="btn fb"
href="https://www.facebook.com/share/1K43uXBmv3/?mibextid=wwXIfr"
target="_blank">
📘 Facebook
</a>

<a class="btn tt"
href="https://www.tiktok.com/@thay_hieu_korea?_r=1&_t=ZS-98UeCZ7023r"
target="_blank">
🎵 TikTok
</a>

<div class="footer">
Cảm ơn bạn đã ghé thăm ❤️
</div>

</div>

</body>
</html>
